name: Hassfest

on:
  push:
    branches: [Core, distribution/hacs-beta]
  pull_request:
    branches: [Core, distribution/hacs-beta]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
