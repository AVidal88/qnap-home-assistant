name: Tests

on:
  pull_request:
    branches: [Core]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Requires the client release before the integration PR can pass CI.
      - run: pip install -r requirements_test.txt qnap-client==1.1.1
      - run: pytest -q
